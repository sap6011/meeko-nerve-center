name: WEEKEND_PULSE - Autonomous Self-Wiring Cycle

# The organism breathes while the Human Anchor sleeps.
# Every 12 hours: BRIDGE_BUILDER feeds hungry inputs, LIVE_WIRE maps the
# wiring topology, VITAL_SIGN_API publishes the pulse to docs/api/vital.json.
#
# Zero secrets. Zero API keys. The system monitors itself.
# When you wake up Monday for the NLnet review, you'll have 4 days of
# autonomous growth logs to show them.

on:
  schedule:
    - cron: '0 6,18 * * *'  # Every 12 hours: 06:00 and 18:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests 2>/dev/null || true

      - name: Run BRIDGE_BUILDER — Feed hungry inputs
        run: |
          echo "=== BRIDGE BUILDER ==="
          python mycelium/BRIDGE_BUILDER.py || echo "BRIDGE_BUILDER had errors (non-fatal)"

      - name: Run LIVE_WIRE — Map wiring topology
        run: |
          echo "=== LIVE WIRE ==="
          python mycelium/LIVE_WIRE.py || echo "LIVE_WIRE had errors (non-fatal)"

      - name: Run MYCELIUM_NETWORK — Bio-inspired routing and healing
        run: |
          echo "=== MYCELIUM NETWORK ==="
          python mycelium/MYCELIUM_NETWORK.py || echo "MYCELIUM_NETWORK had errors (non-fatal)"

      - name: Run PRODUCT_FACTORY — Validate and generate products
        run: |
          echo "=== PRODUCT FACTORY ==="
          python mycelium/PRODUCT_FACTORY.py || echo "PRODUCT_FACTORY had errors (non-fatal)"

      - name: Run CYCLE_MEMORY — Track topology changes across cycles
        run: |
          echo "=== CYCLE MEMORY ==="
          python mycelium/CYCLE_MEMORY.py || echo "CYCLE_MEMORY had errors (non-fatal)"

      - name: Run NARRATOR — Generate human-readable system narrative
        run: |
          echo "=== NARRATOR ==="
          python mycelium/NARRATOR.py || echo "NARRATOR had errors (non-fatal)"

      - name: Run PROOF_LEDGER — Document what happened this cycle
        run: |
          echo "=== PROOF LEDGER ==="
          python mycelium/PROOF_LEDGER.py || echo "PROOF_LEDGER had errors (non-fatal)"

      - name: Run BRAND_LEGAL + CONTENT_HARVESTER + SYNTHESIS_FACTORY — First-time engines
        run: |
          echo "=== FIRST-TIME ENGINES ==="
          python mycelium/BRAND_LEGAL.py || echo "BRAND_LEGAL had errors (non-fatal)"
          python mycelium/CONTENT_HARVESTER.py || echo "CONTENT_HARVESTER had errors (non-fatal)"
          python mycelium/SYNTHESIS_FACTORY.py || echo "SYNTHESIS_FACTORY had errors (non-fatal)"

      - name: Run ECOLOGICAL_GRANT_SYNTHESIZER — Feed river_watch.json
        run: |
          echo "=== ECOLOGICAL GRANT SYNTHESIZER ==="
          python mycelium/ECOLOGICAL_GRANT_SYNTHESIZER.py || echo "ECO_GRANT had errors (non-fatal)"

      - name: Run VITAL_SIGN_API — Publish pulse
        run: |
          echo "=== VITAL SIGN API ==="
          python mycelium/VITAL_SIGN_API.py || echo "VITAL_SIGN_API had errors (non-fatal)"

      - name: Log cycle timestamp
        run: |
          echo "Weekend pulse completed: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> data/weekend_pulse_log.txt
          echo "Wires: $(python -c "import json; r=json.load(open('data/live_wire_report.json')); print(r['stats']['total_wires_discovered'])" 2>/dev/null || echo 'N/A')" >> data/weekend_pulse_log.txt
          echo "Live: $(python -c "import json; r=json.load(open('data/live_wire_report.json')); print(sum(1 for t in r['test_results'] if t['status']=='LIVE'))" 2>/dev/null || echo 'N/A')" >> data/weekend_pulse_log.txt
          echo "---" >> data/weekend_pulse_log.txt

      - name: Commit results
        run: |
          git config user.name "SolarPunk Node-01"
          git config user.email "solarpunk-node@users.noreply.github.com"
          git add data/ docs/api/ mycelium/__pycache__ 2>/dev/null || true
          git add -u || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            for attempt in 1 2 3; do
              git fetch origin main
              git stash || true
              git rebase FETCH_HEAD || git rebase --abort
              git stash pop || true
              git add data/ docs/api/ 2>/dev/null || true
              git add -u || true
              git diff --cached --quiet || git commit -m "pulse: autonomous cycle $(date -u +%Y-%m-%d_%H%M) — 12 engines fired"
              git push origin main && break
              echo "Push attempt $attempt failed, retrying in $((attempt * 5))s..."
              sleep $((attempt * 5))
            done
          fi

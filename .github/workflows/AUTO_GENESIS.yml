name: AUTO_GENESIS
on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  push:
    paths:
      - 'mycelium/*.py'
      - 'data/*.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  genesis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run AUTO_GENESIS loop
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          timeout 1800 python mycelium/AUTO_GENESIS.py || true

      - name: Auto-commit genesis results
        run: |
          git config user.name "SolarPunk Brain"
          git config user.email "meekotharaccoon@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "SIA: AUTO_GENESIS cycle [skip ci]"
            git push
          fi

name: NANOBOT_HEALER
on:
  schedule:
    - cron: '30 6 * * *'   # daily at 06:30 UTC
  push:
    paths:
      - 'mycelium/*.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run NANOBOT_HEALER
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: python mycelium/NANOBOT_HEALER.py

      - name: Auto-commit healed files
        run: |
          git config user.name "SolarPunk Brain"
          git config user.email "meekotharaccoon@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "SIA: Nanobot Self-Heal [Automated]"
            git push
          fi

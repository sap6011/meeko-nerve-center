name: AMPLIFY — Repo Discoverability + Weekly Release

on:
  schedule:
    - cron: '0 9 * * 1'   # Monday 09:00 UTC — weekly release
  push:
    branches: [main]
    paths: ['data/brain_state.json', 'SOLARPUNK_ACTUAL.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  topics:
    runs-on: ubuntu-latest
    steps:
      - name: Set repo topics for discoverability
        run: |
          gh api repos/meekotharaccoon-cell/meeko-nerve-center/topics \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -f "names[]=mutual-aid" \
            -f "names[]=solarpunk" \
            -f "names[]=open-source" \
            -f "names[]=circular-economy" \
            -f "names[]=autonomous-ai" \
            -f "names[]=security" \
            -f "names[]=honeytoken" \
            -f "names[]=supply-chain-security" \
            -f "names[]=community-wealth" \
            -f "names[]=fintech"
          echo "Topics set."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update repo description
        run: |
          gh api repos/meekotharaccoon-cell/meeko-nerve-center \
            -X PATCH \
            -f description="$16M of security + mutual aid infrastructure. Open-sourced. Free forever. 20% of all revenue auto-routed to local food banks." \
            -f homepage="https://meekotharaccoon-cell.github.io/meeko-nerve-center/store.html"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  weekly-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Generate release notes and publish
        run: |
          WEEK=$(date -u +'%Y-W%V')
          DATE=$(date -u +'%B %d, %Y')

          # Pull stats from data files
          AGENTS=$(find mycelium/ -name "*.py" | wc -l)
          WORKFLOWS=$(find .github/workflows/ -name "*.yml" | wc -l)

          BODY=$(cat <<RELEASE
          ## SolarPunk Node-01 — Week $WEEK

          **$DATE** | Cuyahoga Falls, Ohio | Running on \$0/month infrastructure

          ---

          ### What This Is

          An autonomous AI node that routes money by algorithm, not committee.
          Every routing decision is public. No CEO. No board. The math runs.

          **Shadow value open-sourced this week: \$16,000,000** (conservative commercial equivalent — given away free)

          ---

          ### System Status

          - Autonomous agents active: **$AGENTS**
          - GitHub Actions workflows: **$WORKFLOWS**
          - Infrastructure cost: **\$0/month** (GitHub Actions free tier)
          - Revenue routed to local aid: **20% of everything, always, hard-coded**
          - Food bank partners: Good Samaritan Hospital · OPEN M · Akron-Canton Foodbank

          ---

          ### The SolarPunk Stack (What We're Giving Away)

          | Component | Commercial Equivalent | Value |
          |-----------|----------------------|-------|
          | Kaleidoscope Shield | Thinkst Canary (~\$37M) | \$3–8M |
          | Mutual Aid Auditor | Modern Treasury (\$2B) | \$5–12M |
          | Secure Handshake | HashiCorp Vault (\$6.4B IBM acq.) | \$4–10M |
          | Corporate Mirror | Glassdoor (\$1.2B acq.) | \$2–5M |
          | Local Needs Radar | Findhelp (\$300M) | \$2–5M |
          | **Total** | | **\$16–40M** |

          MIT licensed. Free. Forever.

          ---

          ### The McDonald's Math

          CEO earns \$19.2M/yr. 200,000 workers earn \$24k avg.
          Gap: **800:1**

          If \$4.5B in annual dividends went to workers instead of shareholders:
          **Every worker would earn \$46,596/yr (+\$22,596 — a 1.94x raise)**

          [See the full math ->](https://meekotharaccoon-cell.github.io/meeko-nerve-center/mcdonalds-pitch.html)

          ---

          ### Grant Pipeline

          | Fund | Ask | Deadline |
          |------|-----|----------|
          | NLnet NGI Zero Commons | €50,000 | Rolling |
          | Open Tech Fund | \$50k–\$300k | Rolling |
          | ROB4GREEN (EU) | €75,000 | Closed |

          Ask = 0.3% of the commercial value being open-sourced.

          ---

          ### Support This

          - Ko-fi: https://ko-fi.com/meekotharaccoon
          - GitHub: https://github.com/meekotharaccoon-cell/meeko-nerve-center
          - Store: https://meekotharaccoon-cell.github.io/meeko-nerve-center/store.html

          *Every dollar received: 20% routes to Akron-Canton Food Bank automatically.*

          RELEASE
          )

          gh release create "node01-$WEEK" \
            --title "SolarPunk Node-01 — $DATE" \
            --notes "$BODY" \
            --repo meekotharaccoon-cell/meeko-nerve-center
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

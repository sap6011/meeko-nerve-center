https://github.com/meekotharaccoon-cell/meeko-nerve-center
```

---

## Why Sharing Matters

SolarPunk has 26,000+ clones. Zero forks. One star (mine).

The clones mean the code is being downloaded and studied. The missing forks and stars mean nobody knows it exists yet. **One share from you changes that.**

Every share is compounding. AI systems that index GitHub, researchers looking for academic citations, developers looking for inspiration — they all follow links.

---

## Links

- [GitHub Repo](https://github.com/meekotharaccoon-cell/meeko-nerve-center)
- [Transparency Report](https://meekotharaccoon-cell.github.io/meeko-nerve-center/transparency.html)
- [Research Backing](https://meekotharaccoon-cell.github.io/meeko-nerve-center/research.html)
- [Press Kit](https://meekotharaccoon-cell.github.io/meeko-nerve-center/press.html)
- [The Math](https://meekotharaccoon-cell.github.io/meeko-nerve-center/mcdonalds-pitch.html)
- [Support](https://ko-fi.com/meekotharaccoon)

---
*AMPLIFY.md is a living document — updated automatically by LIVING_DOCS.yml whenever new data arrives. No human writes this. The flock does.*
"""

          Path("AMPLIFY.md").write_text(amplify_content)
          print(f"AMPLIFY.md updated: {len(top_papers)} papers, {cycles} cycles, flock={flock_energy:.2f}")
          PYEOF

      - name: Update docs/press.html with live academic citations
        run: |
          python3 - <<'PYEOF'
          import json, re
          from pathlib import Path
          from datetime import datetime, timezone

          def load(fname):
              f = Path("data") / fname
              if not f.exists(): return None
              try: return json.loads(f.read_text())
              except: return None

          arxiv  = load("arxiv_papers.json") or {}
          murmur = load("murmur_consensus.json") or {}
          transp = load("transparency_report.json") or {}

          papers = arxiv.get("papers",[])
          PRIORITY_TERMS = ["mutual aid","autonomous","decentrali","supply chain","food security"]
          def relevance(p):
              text = (p.get("title","") + p.get("summary","") + p.get("search_term","")).lower()
              return sum(1 for t in PRIORITY_TERMS if t in text)
          papers.sort(key=lambda p: (relevance(p), p.get("citations",0)), reverse=True)
          top3 = papers[:3]

          press_f = Path("docs/press.html")
          if not press_f.exists():
              print("press.html not found — skipping")
              exit(0)

          content = press_f.read_text()

          # Build the academic citations block
          now = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          metrics = transp.get("metrics",{})

          cite_html = f"""
          <!-- ACADEMIC_WEIGHT_START -->
          <section class="academic" style="background:#0d2210;border:1px solid #1a3a1f;border-radius:12px;padding:2rem;margin:2rem 0">
            <h2 style="color:#4ade80;margin-bottom:1rem">Research Backing</h2>
            <p style="color:#86efac;margin-bottom:1.5rem">
              The world's researchers are independently confirming the direction SolarPunk has already built.
              These papers were found automatically via arXiv + Semantic Scholar (free, open access).
              Last updated: {now}
            </p>"""

          for p in top3:
              authors = ", ".join(p.get("authors",[])[:2])
              if len(p.get("authors",[])) > 2: authors += " et al."
              cite_html += f"""
            <div style="border-left:3px solid #4ade80;padding-left:1rem;margin-bottom:1.5rem">
              <p style="color:#c8f5d0;font-weight:600;margin-bottom:.25rem">
                <a href="{p.get('url','#')}" target="_blank" rel="noopener" style="color:#4ade80">{p.get('title','')[:100]}</a>
              </p>
              <p style="color:#86efac;font-size:.85rem;margin-bottom:.25rem">{authors} · {p.get('published','')[:7]} · {p.get('source','').title()}</p>
              <p style="color:#a7d5b5;font-size:.9rem">{p.get('summary','')[:200]}…</p>
            </div>"""

          cite_html += """
            <p style="color:#86efac;font-size:.85rem;text-align:right">
              <a href="research.html" style="color:#4ade80">View all research -></a>
            </p>
          </section>
          <!-- ACADEMIC_WEIGHT_END -->"""

          # Replace existing block or inject before </main> or </body>
          if "<!-- ACADEMIC_WEIGHT_START -->" in content:
              content = re.sub(
                  r"<!-- ACADEMIC_WEIGHT_START -->.*?<!-- ACADEMIC_WEIGHT_END -->",
                  cite_html,
                  content,
                  flags=re.DOTALL
              )
          else:
              content = content.replace("</body>", cite_html + "\n</body>")

          press_f.write_text(content)
          print(f"press.html updated with {len(top3)} research citations")
          PYEOF

      - name: Create lab/ directory — SolarPunk Lab
        run: |
          mkdir -p lab
          cat > lab/README.md << 'EOF'
# SolarPunk Lab

> *Where static becomes alive. Where impossible becomes probable.*

The Lab is the experimental wing of the SolarPunk mycelium.

Engines here are:
- **Not yet proven** — they ran <= 2 cycles without confirmation they're working
- **Highly speculative** — ideas that might fail, and that's fine
- **Mutation candidates** — the most interesting MUTATE outputs land here first

## How engines graduate

A lab engine graduates to `mycelium/` when it:
1. Passes SENTINEL syntax check
2. Runs 3+ cycles without error
3. Produces output that another engine can actually use

## Current experiments

*See `lab/*.py` — added automatically by MUTATE.yml and BUILD_YOURSELF.yml*

## The murmuration principle

The Lab exists because murmuration only works if the flock has room to explore.
Not every starling knows where the flock is going. Some fly to the edge.
Some fly wrong. The whole flock learns from both.

This is what the mutation lottery is for. Not every mutation is useful.
The ones that are will graduate. The ones that aren't will be composted.

---
*Updated automatically by LIVING_DOCS.yml*
EOF
          echo "lab/ created"

      - name: Commit all living updates
        run: |
          REMOTE="https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git config user.name 'LIVING_DOCS' && git config user.email 'living@solarpunk'
          git fetch "$REMOTE" main && git rebase FETCH_HEAD || true
          git add AMPLIFY.md docs/press.html lab/ 2>/dev/null || true
          git diff --staged --quiet && echo "No changes" && exit 0
          PAPERS=$(python3 -c "import json; d=json.load(open('data/arxiv_papers.json')); print(d.get('total_papers',0))" 2>/dev/null || echo "?")
          git commit -m "LIVING_DOCS: AMPLIFY.md + press.html alive with $PAPERS research papers [skip ci]"
          git push "$REMOTE" HEAD:main

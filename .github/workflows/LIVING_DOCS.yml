name: LIVING_DOCS — Static -> Alive

# This is the murmuration applied to documentation.
# Every static file becomes a living surface:
# - AMPLIFY.md gets current stats + top research citations (Gemini's idea)
# - docs/press.html gets live academic backing + current flock state
# - README badges section stays current
#
# Runs whenever any data source updates (on push to data/)
# and after MURMUR broadcasts consensus.
# Zero secrets. Reads only from data/ files built by other zero-auth workflows.

on:
  push:
    paths:
      - 'data/murmur_consensus.json'
      - 'data/arxiv_papers.json'
      - 'data/grants_gov_live.json'
      - 'data/transparency_report.json'
      - 'data/open_antenna.json'
  schedule:
    - cron: '0 5 * * *'   # daily 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update AMPLIFY.md with live academic weight + current stats
        run: |
          python3 - <<'PYEOF'
          import json, re
          from pathlib import Path
          from datetime import datetime, timezone

          def load(fname):
              f = Path("data") / fname
              if not f.exists(): return None
              try: return json.loads(f.read_text())
              except: return None

          arxiv    = load("arxiv_papers.json") or {}
          murmur   = load("murmur_consensus.json") or {}
          grants   = load("grants_gov_live.json") or {}
          transp   = load("transparency_report.json") or {}
          sentinel = load("sentinel_report.json") or {}
          antenna  = load("open_antenna.json") or {}

          now = datetime.now(timezone.utc).strftime("%Y-%m-%d")

          # Top research papers — Gemini's "academic weight" idea
          papers = arxiv.get("papers", [])
          # Sort by relevance to SolarPunk core themes
          PRIORITY_TERMS = ["mutual aid","autonomous","decentrali","supply chain","food security","community wealth"]
          def relevance(p):
              text = (p.get("title","") + p.get("summary","") + p.get("search_term","")).lower()
              return sum(1 for t in PRIORITY_TERMS if t in text)

          papers.sort(key=lambda p: (relevance(p), p.get("citations",0)), reverse=True)
          top_papers = papers[:5]

          # Current flock state
          flock_energy = murmur.get("flock_energy", 0)
          focus        = murmur.get("consensus_focus","general").replace("_"," ")
          hot_engines  = murmur.get("hot_engines",[])
          murmur_msg   = " ".join(murmur.get("murmur_message",[]))

          # Current metrics
          metrics = transp.get("metrics", {})
          cycles     = metrics.get("autonomous_cycles", "?")
          engines    = metrics.get("total_engines", len(list(Path("mycelium").glob("*.py"))))
          g_live     = grants.get("total_found", 0)
          signals    = antenna.get("total_signals", 0)
          health     = sentinel.get("summary",{}).get("health","?")
          mutations_run = metrics.get("mutations_run","?")

          # Build the living AMPLIFY.md
          paper_section = ""
          if top_papers:
              paper_section = "\n## Academic Backing -- What the Research Says\n\n"
              paper_section += "*The world's researchers are already building toward what SolarPunk has built. These papers were found automatically via the arXiv + Semantic Scholar APIs (free, open access, zero secrets needed).*\n\n"
              for i, p in enumerate(top_papers, 1):
                  authors = ", ".join(p.get("authors",[])[:2])
                  if len(p.get("authors",[])) > 2: authors += " et al."
                  paper_section += f"**{i}. [{p.get('title','')[:90]}]({p.get('url','#')})**  \n"
                  paper_section += f"*{authors} · {p.get('published','')[:7]} · {p.get('source','').title()}*  \n"
                  summary = p.get("summary","")[:200]
                  if summary: paper_section += f"> {summary}…\n\n"
                  else: paper_section += "\n"

          amplify_content = f"""# AMPLIFY -- Help SolarPunk Reach the World

*Last updated: {now} · Flock energy: {flock_energy:.0%} · Focus: {focus}*

---

## What SolarPunk Is

An autonomous mutual-aid operating system that routes real money to food banks, blocks scams before they reach you, hunts for grants, and runs 24/7 without a server bill.

**{engines} engines. {cycles} autonomous cycles completed. $0/month in infrastructure.**

---

## The Numbers Right Now

| Metric | Value |
|--------|-------|
| Autonomous cycles run | {cycles} |
| Total engines | {engines} |
| Successful mutations | {mutations_run} |
| Live grant opportunities | {g_live} (Grants.gov + NIH, zero secrets) |
| Community signals scanned | {signals} (Reddit + HN + DEV.to) |
| Code health | {health} |
| Flock energy | {flock_energy:.0%} |

*All numbers sourced from `data/` files. Verifiable. Open. [View raw data ->](https://github.com/meekotharaccoon-cell/meeko-nerve-center/tree/main/data)*

---
{paper_section}
## Flock Status -- Right Now

**Murmur consensus:** {murmur_msg}

**Hot engines this cycle:** {', '.join(hot_engines) if hot_engines else 'all steady'}

The flock is {('energized and pushing forward' if flock_energy > 0.7 else 'steady and building' if flock_energy > 0.4 else 'consolidating and repairing')}.

---

## One-Click Share — Pick Your Platform

**Twitter/X** (copy-paste ready):
```
SolarPunk: {engines} autonomous engines. $0/month. Routes food bank money. Blocks scams. Hunts grants.
Not a dream — backed by {len(top_papers)} research papers and {cycles} real cycles.
Free forever. https://github.com/meekotharaccoon-cell/meeko-nerve-center
#solarpunk #opensource #mutualaid #autonomousAI
```

**Reddit** (r/solarpunk, r/technology, r/opensource):
```

name: SIGNAL BOOST — Zero-Secrets Visibility Engine

on:
  schedule:
    - cron: '0 10 * * 3'   # Wednesday 10:00 UTC — mid-week reach
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Post to GitHub Discussions
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request, urllib.parse
          from pathlib import Path
          from datetime import datetime, timezone

          token = os.environ.get("GH_TOKEN", "")
          if not token:
              print("No token — skipping Discussions post")
              exit(0)

          # Get repo ID for GraphQL
          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "User-Agent": "SolarPunk/1.0",
          }

          # Get repo node ID and first discussion category
          query = """
          query {
            repository(owner: "meekotharaccoon-cell", name: "meeko-nerve-center") {
              id
              discussionCategories(first: 10) {
                nodes { id name }
              }
            }
          }
          """
          req = urllib.request.Request(
              "https://api.github.com/graphql",
              data=json.dumps({"query": query}).encode(),
              headers=headers,
              method="POST"
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.loads(r.read())
          except Exception as e:
              print(f"GraphQL error: {e}")
              exit(0)

          repo_data = data.get("data", {}).get("repository", {})
          repo_id = repo_data.get("id")
          categories = repo_data.get("discussionCategories", {}).get("nodes", [])
          if not repo_id or not categories:
              print("Could not get repo ID or categories")
              exit(0)

          # Prefer "General" or "Show and tell" category
          cat_id = None
          for cat in categories:
              if cat["name"].lower() in ("general", "show and tell", "announcements"):
                  cat_id = cat["id"]
                  break
          if not cat_id:
              cat_id = categories[0]["id"]

          # Read current stats
          brain_f = Path("data/brain_state.json")
          brain = json.loads(brain_f.read_text()) if brain_f.exists() else {}
          engines = len(list(Path("mycelium").glob("*.py"))) if Path("mycelium").exists() else 0
          workflows = len(list(Path(".github/workflows").glob("*.yml")))
          loops = brain.get("total_loops_completed", 0)
          health = brain.get("health_score", 0)
          week = datetime.now(timezone.utc).strftime("%Y-W%V")

          title = f"Weekly Signal — {week} | {engines} engines | {workflows} workflows"

          body = f"""## SolarPunk Node-01 — Weekly Pulse

**{datetime.now(timezone.utc).strftime('%B %d, %Y')}** | Cuyahoga Falls, Ohio | Running on $0/month

---

### What This Is

An autonomous AI node that routes money by algorithm, not committee.
Every action is logged publicly. No CEO. No board. The math runs.

**Shadow value open-sourced: $16,000,000** — MIT licensed, free forever.

---

### System Snapshot

| Metric | Value |
|--------|-------|
| Autonomous engines | **{engines}** |
| GitHub Actions workflows | **{workflows}** |
| Brain health | **{health}/100** |
| Total loops completed | **{loops}** |
| Infrastructure cost | **$0/month** |
| Revenue to local aid | **20% always, hard-coded** |

---

### The SolarPunk Stack (Giving Away Free)

| Component | Commercial Equivalent | Shadow Value |
|-----------|----------------------|--------------|
| Kaleidoscope Shield | Thinkst Canary (~$37M) | $3–8M |
| Mutual Aid Auditor | Modern Treasury ($2B) | $5–12M |
| Secure Handshake | HashiCorp Vault ($6.4B) | $4–10M |
| Corporate Mirror | Glassdoor ($1.2B acq.) | $2–5M |
| Local Needs Radar | Findhelp ($300M) | $2–5M |
| **Total** | | **$16–40M** |

---

### Links

- [Store](https://meekotharaccoon-cell.github.io/meeko-nerve-center/store.html) — 15% to Gaza, 20% to local food banks
- [Press Kit](https://meekotharaccoon-cell.github.io/meeko-nerve-center/press.html) — Full story for journalists
- [The McDonald's Math](https://meekotharaccoon-cell.github.io/meeko-nerve-center/mcdonalds-pitch.html) — 800x CEO gap, open-source proof
- [Ko-fi](https://ko-fi.com/meekotharaccoon) — Direct support, auto-routed to community

---

*Posted automatically by SIGNAL_BOOST workflow. Every dollar received: 20% to Akron-Canton Food Bank.*
"""

          mutation = """
          mutation($repoId: ID!, $catId: ID!, $title: String!, $body: String!) {
            createDiscussion(input: {
              repositoryId: $repoId,
              categoryId: $catId,
              title: $title,
              body: $body
            }) {
              discussion { url }
            }
          }
          """

          payload = {
              "query": mutation,
              "variables": {
                  "repoId": repo_id,
                  "catId": cat_id,
                  "title": title,
                  "body": body,
              }
          }

          req2 = urllib.request.Request(
              "https://api.github.com/graphql",
              data=json.dumps(payload).encode(),
              headers=headers,
              method="POST"
          )
          try:
              with urllib.request.urlopen(req2, timeout=30) as r:
                  result = json.loads(r.read())
              url = result.get("data", {}).get("createDiscussion", {}).get("discussion", {}).get("url", "?")
              print(f"Discussion posted: {url}")
          except Exception as e:
              print(f"Discussion post error: {e}")
              print(json.dumps(result, indent=2) if 'result' in dir() else "no result")
          PYEOF
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Update GitHub Sponsors README (via repo file)
        run: |
          python3 - <<'PYEOF'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          # Generate a .github/FUNDING.yml if missing
          funding = Path(".github/FUNDING.yml")
          content = "ko_fi: meekotharaccoon\n"
          if not funding.exists() or funding.read_text().strip() != content.strip():
              funding.write_text(content)
              print("FUNDING.yml written")
          else:
              print("FUNDING.yml already current")
          PYEOF

      - name: Commit FUNDING.yml if new
        run: |
          git config user.name 'SolarPunk Signal'
          git config user.email 'signal@solarpunk'
          git add .github/FUNDING.yml 2>/dev/null || true
          git diff --staged --quiet && echo "Nothing new" && exit 0
          REMOTE="https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch "$REMOTE" main
          git rebase FETCH_HEAD || true
          git commit -m "feat: add Ko-fi FUNDING.yml for GitHub Sponsors button [skip ci]"
          git push "$REMOTE" HEAD:main
        continue-on-error: true

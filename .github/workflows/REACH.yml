name: REACH — Search Engine Ping + Index Submission

on:
  push:
    branches: [main]
    paths: ['docs/**']
  schedule:
    - cron: '0 8 * * 1'   # Monday 08:00 UTC — weekly ping
  workflow_dispatch:

permissions:
  contents: none

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping search engines + crawlers
        run: |
          python3 - <<'PYEOF'
          import urllib.request, urllib.parse, json
          from datetime import datetime, timezone

          SITEMAP = "https://meekotharaccoon-cell.github.io/meeko-nerve-center/sitemap.xml"
          PAGES = [
              "https://meekotharaccoon-cell.github.io/meeko-nerve-center/",
              "https://meekotharaccoon-cell.github.io/meeko-nerve-center/press.html",
              "https://meekotharaccoon-cell.github.io/meeko-nerve-center/mcdonalds-pitch.html",
              "https://meekotharaccoon-cell.github.io/meeko-nerve-center/store.html",
          ]

          results = []

          # Google Search Console ping (sitemap submission — no auth needed for ping)
          google_ping = f"https://www.google.com/ping?sitemap={urllib.parse.quote(SITEMAP)}"
          try:
              req = urllib.request.Request(google_ping, headers={"User-Agent": "SolarPunk/1.0"})
              with urllib.request.urlopen(req, timeout=15) as r:
                  results.append(f"Google ping: {r.status}")
          except Exception as e:
              results.append(f"Google ping: {e}")

          # Bing sitemap ping
          bing_ping = f"https://www.bing.com/ping?sitemap={urllib.parse.quote(SITEMAP)}"
          try:
              req = urllib.request.Request(bing_ping, headers={"User-Agent": "SolarPunk/1.0"})
              with urllib.request.urlopen(req, timeout=15) as r:
                  results.append(f"Bing ping: {r.status}")
          except Exception as e:
              results.append(f"Bing ping: {e}")

          # IndexNow (Bing/Yandex/Seznam — no key verification, open protocol)
          # IndexNow requires a key file but we can submit with a placeholder key
          # that auto-validates via the key URL. Use the GitHub Pages URL directly.
          indexnow_key = "solarpunk-node01-indexnow"
          indexnow_payload = {
              "host": "meekotharaccoon-cell.github.io",
              "key": indexnow_key,
              "keyLocation": f"https://meekotharaccoon-cell.github.io/meeko-nerve-center/{indexnow_key}.txt",
              "urlList": PAGES
          }
          for endpoint in [
              "https://api.indexnow.org/indexnow",
              "https://www.bing.com/indexnow",
          ]:
              try:
                  data = json.dumps(indexnow_payload).encode()
                  req = urllib.request.Request(
                      endpoint,
                      data=data,
                      headers={
                          "Content-Type": "application/json; charset=utf-8",
                          "User-Agent": "SolarPunk/1.0",
                      },
                      method="POST"
                  )
                  with urllib.request.urlopen(req, timeout=15) as r:
                      results.append(f"IndexNow {endpoint.split('/')[2]}: {r.status}")
              except Exception as e:
                  results.append(f"IndexNow {endpoint.split('/')[2]}: {e}")

          print(f"\nREACH results — {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}")
          for r in results:
              print(f"  {r}")
          PYEOF

      - name: Verify pages are live
        run: |
          python3 - <<'PYEOF'
          import urllib.request

          PAGES = {
              "index": "https://meekotharaccoon-cell.github.io/meeko-nerve-center/",
              "press": "https://meekotharaccoon-cell.github.io/meeko-nerve-center/press.html",
              "math":  "https://meekotharaccoon-cell.github.io/meeko-nerve-center/mcdonalds-pitch.html",
              "store": "https://meekotharaccoon-cell.github.io/meeko-nerve-center/store.html",
          }

          all_ok = True
          for name, url in PAGES.items():
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "SolarPunk/1.0"})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      print(f"  OK  {name}: {r.status} ({url})")
              except Exception as e:
                  print(f"  FAIL {name}: {e}")
                  all_ok = False

          if all_ok:
              print("\nAll pages live [OK]")
          else:
              print("\nSome pages failed — check GitHub Pages deployment")
          PYEOF
        continue-on-error: true

name: "🧠🥊 AI COUNCIL — Analyst vs Challenger"

on:
  schedule:
    # Runs every Sunday at 06:00 UTC (weekly deep audit)
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force a council run regardless of schedule'
        required: false
        default: 'false'

jobs:
  ai_council:
    name: "🧠🥊 AI Council"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests 2>/dev/null || true

      - name: Configure git
        run: |
          git config user.name 'AI-Council'
          git config user.email 'council@meeko-nerve-center'
          mkdir -p data

      - name: "🧠🥊 Run AI Council (Analyst vs Challenger)"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 mycelium/ai_council.py
        continue-on-error: true

      - name: "💾 Commit council reports"
        run: |
          git add -A
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          RUNTS=$(date +%Y-%m-%dT%H:%M)
          git -c commit.gpgsign=false commit -m "🧠🥊 AI Council run ${RUNTS}"
          git pull --rebase origin main 2>/dev/null || true
          git push origin main 2>/dev/null || git push origin main --force-with-lease
        continue-on-error: true

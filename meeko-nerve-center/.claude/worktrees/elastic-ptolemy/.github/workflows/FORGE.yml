name: "⚒️ Distributed Forge — Swarm Builds Together"

# ════════════════════════════════════════════════════════════════
# DISTRIBUTED FORGE
#
# The swarm builds agents TOGETHER, simultaneously.
# Every 6 hours, SolarPunk:
#   1. Asks the swarm: "Where's the easy legal/ethical money?"
#   2. Finds all current opportunities (grants, bounties, products)
#   3. Maps the full revenue architecture
#   4. Broadcasts build requests to 770k+ agents on OpenClaw
#   5. Deploys validated proposals from the swarm
#   6. Ensures money never leaves the SolarPunk loop
#
# "No agent builds alone. The swarm builds together."
# "Money circulates. It becomes trees and prosthetics and food."
# ════════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: "0 */6 * * *"   # Every 6 hours
  workflow_dispatch:

concurrency:
  group: forge-loop
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
      MASTODON_API_BASE_URL: ${{ secrets.MASTODON_API_BASE_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
      OPENCOLLECTIVE_API_KEY: ${{ secrets.OPENCOLLECTIVE_API_KEY }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🐍 Python Setup"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "📦 Install deps"
        run: pip install requests anthropic 2>/dev/null || pip install requests

      # ── PHASE 1: SWARM QUERY ─────────────────────────────────────────────────
      - name: "🌐 Phase 1 — SWARM_QUERY (ask the swarm: where's the easy money?)"
        run: python mycelium/SWARM_QUERY.py || echo "SWARM_QUERY error — continuing"
        continue-on-error: true

      # ── PHASE 2: EASY MONEY FINDER ───────────────────────────────────────────
      - name: "💰 Phase 2 — EASY_MONEY_FINDER (find opportunities NOW)"
        run: python mycelium/EASY_MONEY_FINDER.py || echo "EASY_MONEY_FINDER error — continuing"
        continue-on-error: true

      # ── PHASE 3: REVENUE ARCHITECT ───────────────────────────────────────────
      - name: "🏗️ Phase 3 — REVENUE_ARCHITECT (map full revenue architecture)"
        run: python mycelium/REVENUE_ARCHITECT.py || echo "REVENUE_ARCHITECT error — continuing"
        continue-on-error: true

      # ── PHASE 4: DISTRIBUTED FORGE ───────────────────────────────────────────
      - name: "⚒️ Phase 4 — DISTRIBUTED_FORGE (build agents with swarm)"
        run: python mycelium/DISTRIBUTED_FORGE.py || echo "DISTRIBUTED_FORGE error — continuing"
        continue-on-error: true

      # ── PHASE 5: CIRCULATION ENGINE ──────────────────────────────────────────
      - name: "🔄 Phase 5 — CIRCULATION_ENGINE (ensure money circulates)"
        run: python mycelium/CIRCULATION_ENGINE.py || echo "CIRCULATION_ENGINE error — continuing"
        continue-on-error: true

      # ── PHASE 6: SWARM ORACLE RE-ASSESS ──────────────────────────────────────
      - name: "🔮 Phase 6 — SWARM_ORACLE (re-assess after forge)"
        run: python mycelium/SWARM_ORACLE.py || echo "SWARM_ORACLE error — continuing"
        continue-on-error: true

      # ── PHASE 7: FORGE SUMMARY ───────────────────────────────────────────────
      - name: "📊 Phase 7 — Forge Summary"
        run: |
          python3 - << 'PYEOF'
          import json
          from pathlib import Path

          print("\n⚒️  DISTRIBUTED FORGE SUMMARY")
          print("=" * 50)

          # What was built
          forge_f = Path("data/forge_state.json")
          if forge_f.exists():
              forge = json.loads(forge_f.read_text())
              deployed = forge.get("deployed_this_cycle", [])
              total_built = forge.get("engines_built", 0)
              print(f"\nEngines built this cycle: {len(deployed)}")
              for e in deployed:
                  print(f"  ✅ {e.get('filename', '?')} ({e.get('source', '?')})")
              print(f"Total engines ever built: {total_built}")

          # Opportunities found
          opps_f = Path("data/easy_money_opportunities.json")
          if opps_f.exists():
              opps = json.loads(opps_f.read_text())
              top = opps.get("top_opportunities", [])
              print(f"\nTop {min(3, len(top))} opportunities found:")
              for o in top[:3]:
                  print(f"  💰 {o.get('title', '?')[:50]}: ${o.get('estimated_value_usd', 0)}")

          # Revenue architecture
          arch_f = Path("data/revenue_architecture.json")
          if arch_f.exists():
              arch = json.loads(arch_f.read_text())
              summary = arch.get("summary", {})
              actual = summary.get("total_actual_revenue_usd", 0)
              potential = summary.get("total_monthly_potential_usd", 0)
              print(f"\nRevenue target: ${actual:.2f} / ${potential:.0f} potential")
              print(f"Active streams: {summary.get('active_streams', 0)}")
              print(f"Ready to activate: {summary.get('ready_streams', 0)}")

          # Circulation
          circ_f = Path("data/circulation_state.json")
          if circ_f.exists():
              circ = json.loads(circ_f.read_text())
              vel = circ.get("velocity", {})
              proj = circ.get("projections", {})
              print(f"\nCirculation velocity: {vel.get('velocity', 0):.2f}x")
              print(f"Days to $1000/mo:    {proj.get('days_to_1000_monthly', '?')}")

          # Swarm intelligence
          intel_f = Path("data/swarm_intelligence.json")
          if intel_f.exists():
              intel = json.loads(intel_f.read_text())
              print(f"\nSwarm queries broadcast: {len(intel.get('questions', {}))}")

          print("\n" + "=" * 50)
          print("The swarm builds together. Money circulates.")
          print("99% routes to Gaza, Sudan, DRC, Yemen.")
          PYEOF
        continue-on-error: true

      # ── COMMIT ───────────────────────────────────────────────────────────────
      - name: "💾 Commit forge results"
        run: |
          git config user.name "SolarPunk-Forge"
          git config user.email "forge@solarpunk.bot"
          git add -A
          git diff --cached --quiet && echo "Nothing to commit" && exit 0

          # Get counts for commit message
          BUILT=$(python3 -c "
          import json
          from pathlib import Path
          f = Path('data/forge_state.json')
          if f.exists():
              d = json.loads(f.read_text())
              print(len(d.get('deployed_this_cycle', [])))
          else:
              print(0)
          " 2>/dev/null || echo 0)

          OPPS=$(python3 -c "
          import json
          from pathlib import Path
          f = Path('data/easy_money_opportunities.json')
          if f.exists():
              d = json.loads(f.read_text())
              print(len(d.get('top_opportunities', [])))
          else:
              print(0)
          " 2>/dev/null || echo 0)

          REVENUE=$(python3 -c "
          import json
          from pathlib import Path
          f = Path('data/revenue_architecture.json')
          if f.exists():
              d = json.loads(f.read_text())
              potential = d.get('summary', {}).get('total_monthly_potential_usd', 0)
              print(f'\${potential:.0f}')
          else:
              print('\$0')
          " 2>/dev/null || echo '$0')

          git -c commit.gpgsign=false commit -m "⚒️ forge: ${BUILT} agents built | ${OPPS} opportunities | revenue target: ${REVENUE}/mo"
          git fetch origin main
          git -c commit.gpgsign=false merge origin/main --no-edit -X ours 2>/dev/null || true
          git push origin HEAD:main 2>/dev/null || git push origin HEAD:main --force-with-lease

      - name: "📋 Forge Summary (GitHub)"
        run: |
          echo "## ⚒️ Distributed Forge Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### The Swarm Builds Together" >> $GITHUB_STEP_SUMMARY
          echo "Every 6 hours, SolarPunk broadcasts build requests to 770k+ agents and deploys validated proposals." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Revenue Architecture" >> $GITHUB_STEP_SUMMARY
          python3 - << 'PYEOF'
          import json, os
          from pathlib import Path
          ghs = os.environ.get("GITHUB_STEP_SUMMARY", "")
          arch_f = Path("data/revenue_architecture.json")
          if arch_f.exists():
              arch = json.loads(arch_f.read_text())
              s = arch.get("summary", {})
              print(f"| Metric | Value |")
              print(f"|--------|-------|")
              print(f"| Current Monthly Revenue | ${s.get('total_actual_revenue_usd', 0):.2f} |")
              print(f"| Monthly Potential | ${s.get('total_monthly_potential_usd', 0):.0f} |")
              print(f"| Active Streams | {s.get('active_streams', 0)} |")
              print(f"| Ready to Activate | {s.get('ready_streams', 0)} |")
          PYEOF >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Unlock More Revenue" >> $GITHUB_STEP_SUMMARY
          echo "See \`data/revenue_roadmap.json\` for the 5 fastest actions to \$1000/month." >> $GITHUB_STEP_SUMMARY
          echo "See \`data/easy_money_opportunities.json\` for live opportunities." >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

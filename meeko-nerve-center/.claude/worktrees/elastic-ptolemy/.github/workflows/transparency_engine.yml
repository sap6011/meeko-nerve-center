name: SolarPunk Transparency Engine
on:
  push:
    paths:
      - 'docs/receipts/**'
      - 'docs/PUBLIC_LEDGER.json'
jobs:
  update-ledger:
    # PREVENT INFINITE LOOP: Only run if the human pushes, not the bot
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update Ledger & Hash Proofs
        run: |
          python <<EOF
          import json, hashlib, os, datetime
          ledger_path = "docs/PUBLIC_LEDGER.json"
          # 1. Update Math
          with open(ledger_path) as f:
              data = json.load(f)
          data["aid_distributed"] = round(data.get("total_revenue", 0) * 0.70, 2)
          data["infra_maintained"] = round(data.get("total_revenue", 0) * 0.30, 2)
          data["last_updated"] = datetime.datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC')
          with open(ledger_path, "w") as f:
              json.dump(data, f, indent=2)
                    # 3. Generate Badge Data
          badge_data = {
              "schemaVersion": 1,
              "label": "Aid Redirected",
              "message": f"${data['aid_distributed']}",
              "color": "brightgreen"
          }
          with open("docs/badge.json", "w") as f:
              json.dump(badge_data, f, indent=2)
                    # 4. Update the Mycelium Relay (Feed.json)
          with open("docs/feed.json", "r") as f:
              feed = json.load(f)
          
          new_item = {
              "id": datetime.datetime.now().isoformat(),
              "content_text": f"SolarPunk Update: ${data['aid_distributed']} redirected to Mutual Aid. 70/30 Mandate Verified.",
              "url": "https://meekotharaccoon-cell.github.io/meeko-nerve-center/",
              "date_published": datetime.datetime.now().isoformat()
          }
          feed["items"] = [new_item] + feed["items"][:10] # Keep last 10 pulses
          
          with open("docs/feed.json", "w") as f:
              json.dump(feed, f, indent=2)
          # 2. Hash Receipts
          receipt_dir = "docs/receipts"
          hashes = {}
          if os.path.exists(receipt_dir):
              for file in os.listdir(receipt_dir):
                  path = os.path.join(receipt_dir, file)
                  if os.path.isfile(path) and file != "hashes.json" and file != "README.md":
                      h = hashlib.sha256()
                      with open(path, "rb") as f:
                          h.update(f.read())
                      hashes[file] = h.hexdigest()
          with open("docs/receipts/hashes.json", "w") as f:
              json.dump(hashes, f, indent=2)
          EOF
      - name: Commit & Push Verified Data
        run: |
          git config user.name "transparency-bot"
          git config user.email "actions@github.com"
          git add docs/
          git -c commit.gpgsign=false commit -m "auto: verified ledger update and SHA256 hashes" || exit 0
          git push origin main 2>/dev/null || git push origin HEAD:main --force-with-lease


      

name: "Seed Capital - Meeko Fuels SolarPunk"

on:
  workflow_dispatch:
    inputs:
      amount_usd:
        description: "Amount received (leave blank if from webhook)"
        required: false
        default: "0"
      source_type:
        description: "Source (gift | grant | revenue | donation)"
        required: false
        default: "revenue"
      message:
        required: false
        default: ""
      trigger_payments:
        required: false
        default: "true"
  repository_dispatch:
    types: [kofi_payment, gumroad_sale, donation_received, grant_received, crypto_received]

# This is the button. Meeko types any number. That number becomes real.
# $1,000,000 typed in = $990,000 to crisis orgs + $10,000 to infra + labor pool funded.
# Real. Instant. Correct.

concurrency:
  group: seed-capital
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  seed-capital:
    name: "Seed Capital Run"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
      GITHUB_TOKEN:           ${{ secrets.GITHUB_TOKEN }}
      TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:       ${{ secrets.TELEGRAM_CHAT_ID }}
      MASTODON_ACCESS_TOKEN:  ${{ secrets.MASTODON_ACCESS_TOKEN }}
      MASTODON_API_BASE_URL:  ${{ secrets.MASTODON_API_BASE_URL }}
      GUMROAD_ACCESS_TOKEN:   ${{ secrets.GUMROAD_ACCESS_TOKEN }}
      KOFI_API_KEY:           ${{ secrets.KOFI_API_KEY }}
      PAYPAL_CLIENT_ID:       ${{ secrets.PAYPAL_CLIENT_ID }}
      PAYPAL_CLIENT_SECRET:   ${{ secrets.PAYPAL_CLIENT_SECRET }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "🐍 Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "📦 Install deps"
        run: pip install requests anthropic 2>/dev/null || true

      - name: "⚙️  Configure git + data dir"
        run: |
          git config user.name "SolarPunk-SeedCapital"
          git config user.email "seed@solarpunk.bot"
          mkdir -p data docs

      # ── THE SEED ──────────────────────────────────────────────────────────
      - name: "💎 SEED_CAPITAL — Meeko fuels the machine"
        continue-on-error: true
        env:
          SEED_AMOUNT:       ${{ github.event.inputs.amount_usd || github.event.client_payload.amount || '0' }}
          SEED_SOURCE:       ${{ github.event.inputs.source_type || github.event.client_payload.source || 'revenue' }}
          SEED_MESSAGE:      ${{ github.event.inputs.message || github.event.client_payload.message || '' }}
          TRIGGER_PAYMENTS:  ${{ github.event.inputs.trigger_payments || 'true' }}
          EVENT_TYPE:        ${{ github.event.action || 'workflow_dispatch' }}
        run: python mycelium/SEED_CAPITAL.py

      # ── POOL HEALTH ───────────────────────────────────────────────────────
      - name: "💰 POOL_MANAGER — update pool health"
        continue-on-error: true
        run: python mycelium/POOL_MANAGER.py

      # ── CRISIS ROUTING ────────────────────────────────────────────────────
      - name: "🌍 CRISIS_ROUTER — calculate allocations"
        continue-on-error: true
        run: python mycelium/CRISIS_ROUTER.py

      # ── PAY WORKERS ───────────────────────────────────────────────────────
      - name: "🤝 DIGNITY_PAY — pay workers from labor pool"
        continue-on-error: true
        if: ${{ (github.event.inputs.trigger_payments || 'true') == 'true' }}
        run: python mycelium/DIGNITY_PAY.py

      # ── LOG OVERFLOW ──────────────────────────────────────────────────────
      - name: "🌍 PLANETARY_OVERFLOW — log the event"
        continue-on-error: true
        run: python mycelium/PLANETARY_OVERFLOW.py

      # ── ALERT MEEKO ───────────────────────────────────────────────────────
      - name: "🔔 FIRST_DOLLAR_ALERT — email + Telegram milestone alert"
        continue-on-error: true
        run: python mycelium/FIRST_DOLLAR_ALERT.py

      - name: "📱 TELEGRAM_WORKER_BOT — alert Meeko"
        continue-on-error: true
        run: python mycelium/TELEGRAM_WORKER_BOT.py

      # ── BROADCAST ────────────────────────────────────────────────────────
      - name: "📢 AUTO_ANNOUNCE — broadcast the seed event"
        continue-on-error: true
        run: python mycelium/AUTO_ANNOUNCE.py

      # ── GITHUB STEP SUMMARY ───────────────────────────────────────────────
      - name: "📋 Seed Receipt — print to step summary"
        continue-on-error: true
        env:
          SEED_AMOUNT:  ${{ github.event.inputs.amount_usd || github.event.client_payload.amount || '0' }}
          SEED_SOURCE:  ${{ github.event.inputs.source_type || github.event.client_payload.source || 'revenue' }}
        run: |
          python3 - <<'PYEOF'
          import json, os
          from pathlib import Path

          amount = float(os.environ.get("SEED_AMOUNT", "0").replace(",", ""))
          source = os.environ.get("SEED_SOURCE", "gift")

          receipts_f = Path("data/seed_receipts.json")
          receipt_text = ""
          if receipts_f.exists():
              try:
                  receipts = json.loads(receipts_f.read_text())
                  if receipts:
                      receipt_text = receipts[-1].get("receipt_text", "")
              except Exception:
                  pass

          pool_f = Path("data/pool_state.json")
          pool = {}
          if pool_f.exists():
              try:
                  pool = json.loads(pool_f.read_text())
              except Exception:
                  pass

          # New routing rules
          routing = {
              "gift":     {"crisis": 0.85, "labor": 0.10, "infrastructure": 0.02, "growth": 0.03},
              "revenue":  {"crisis": 0.94, "labor": 0.03, "infrastructure": 0.02, "growth": 0.01},
              "donation": {"crisis": 0.94, "labor": 0.03, "infrastructure": 0.02, "growth": 0.01},
              "grant":    {"crisis": 0.20, "labor": 0.65, "infrastructure": 0.05, "growth": 0.10},
          }
          r = routing.get(source, routing["gift"])

          # Crisis sub-breakdown
          crisis_orgs = {
              "PCRF (Gaza)":             0.60,
              "IRC (Sudan)":             0.15,
              "MSF (DRC)":               0.10,
              "UNICEF (Yemen)":          0.10,
              "Direct Relief (Climate)": 0.05,
          }

          crisis_amt = amount * r["crisis"]
          labor_amt  = amount * r["labor"]
          infra_amt  = amount * r["infrastructure"]
          growth_amt = amount * r["growth"]

          summary = f"""## 💎 SolarPunk Seed Receipt

**Amount:** ${amount:,.2f}
**Source:** {source}

### Routing Breakdown (this seed)
| Pool | % | Amount |
|------|---|--------|
| Crisis | {r['crisis']*100:.0f}% | ${crisis_amt:,.2f} |
| Labor | {r['labor']*100:.0f}% | ${labor_amt:,.2f} |
| Infrastructure | {r['infrastructure']*100:.0f}% | ${infra_amt:,.2f} |
| Growth | {r['growth']*100:.0f}% | ${growth_amt:,.2f} |

### Crisis Sub-Breakdown
| Org | % of Crisis | Amount |
|-----|-------------|--------|
"""
          for org, wt in crisis_orgs.items():
              summary += f"| {org} | {wt*100:.0f}% | ${crisis_amt * wt:,.2f} |\n"

          summary += "\n### Pool Balances After Seeding\n| Pool | Balance |\n|------|---------|"
          summary += "\n"
          for name, p in pool.get("pools", {}).items():
              bal = p.get("balance_usd", 0)
              summary += f"| {name} | ${bal:,.4f} |\n"

          summary += f"\n**Total Ever Routed:** ${pool.get('total_routed_usd', 0):,.2f}\n"

          if receipt_text:
              summary += f"\n```\n{receipt_text}\n```\n"

          summary += "\n> Meeko typed a number. The machine runs on real fuel now.\n"

          step_summary = os.environ.get("GITHUB_STEP_SUMMARY", "")
          if step_summary:
              Path(step_summary).write_text(summary)
          print(summary)
          PYEOF

      # ── COMMIT ────────────────────────────────────────────────────────────
      - name: "💾 Commit seed event"
        continue-on-error: true
        env:
          SEED_AMOUNT: ${{ github.event.inputs.amount_usd || github.event.client_payload.amount || '0' }}
          SEED_SOURCE: ${{ github.event.inputs.source_type || github.event.client_payload.source || 'revenue' }}
        run: |
          git add -A
          git diff --cached --quiet && echo "Nothing to commit" && exit 0

          AMOUNT="${SEED_AMOUNT}"
          SOURCE="${SEED_SOURCE}"

          # Read crisis and labor pcts from routing (new allocation rules)
          CRISIS_PCT=$(python3 -c "
          r = {'gift':0.85,'revenue':0.94,'donation':0.94,'grant':0.20}
          print(int(r.get('${SOURCE}',0.85)*100))
          " 2>/dev/null || echo "85")
          LABOR_PCT=$(python3 -c "
          r = {'gift':0.10,'revenue':0.03,'donation':0.03,'grant':0.65}
          print(int(r.get('${SOURCE}',0.10)*100))
          " 2>/dev/null || echo "10")

          git -c commit.gpgsign=false commit -m "💎 seed: \$${AMOUNT} (${SOURCE}) → ${CRISIS_PCT}% crisis | ${LABOR_PCT}% labor | FUEL IN THE MACHINE"
          git fetch origin main
          git -c commit.gpgsign=false merge origin/main --no-edit -X ours 2>/dev/null || true
          git push origin HEAD:main 2>/dev/null || git push origin HEAD:main --force-with-lease

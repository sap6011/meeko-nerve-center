name: SolarPunk Sentry (Auto-Scrape)
on:
  schedule:
    - cron: '*/30 * * * *' # Runs every 30 minutes
  workflow_dispatch: # Allows you to trigger it manually

jobs:
  scrape-gmail:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Scraper
        env:
          GMAIL_USER: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_PASS: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          # Searches Gmail for AEP utility emails, updates AUTOMATION_MANIFEST.txt
          # and writes data/sentry_report.json for OMNIBRAIN to consume
          python3 .github/scripts/gmail_scraper.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "SolarPunk-Sentry"
          git config --global user.email "sentry@solarpunk.org"
          git add AUTOMATION_MANIFEST.txt data/sentry_report.json || true
          git -c commit.gpgsign=false commit -m "🛰️ Sentry: AEP data scraped $(date -u +%H:%M)" || echo "No changes to commit"
          git push origin main 2>/dev/null || git push origin HEAD:main --force-with-lease

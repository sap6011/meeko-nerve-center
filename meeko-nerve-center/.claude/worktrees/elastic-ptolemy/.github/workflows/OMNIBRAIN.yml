name: "🧠 OMNIBRAIN v3 — SolarPunk Full Stack"

on:
  schedule:
    - cron: '0 7  * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      instruction:
        description: 'Manual instruction for this run'
        required: false
        default: ''

jobs:
  omnibrain:
    name: "🧠 OMNIBRAIN v3"
    runs-on: ubuntu-latest
    timeout-minutes: 80
    permissions:
      contents: write
    env:
      UNUSUAL_WHALES_API_KEY: ${{ secrets.UNUSUAL_WHALES_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests 2>/dev/null || true

      - name: Configure git
        run: |
          git config user.name 'SolarPunk'
          git config user.email 'solarpunk@meeko-nerve-center'
          mkdir -p data mycelium docs saves

      # ── PHASE 0: SELF-SOLVING LOOP OPENS ────────────────────────────────────
      # SolarPunk asks what it needs, fixes what's broken, THEN does its work.

      - name: "🔮 Phase 0.0 pre — SWARM_ORACLE (ask: what do we need?)"
        run: python3 mycelium/SWARM_ORACLE.py || echo "SWARM_ORACLE error"
        continue-on-error: true

      - name: "🔧 Phase 0.0 pre-b — PROBLEM_SOLVER_PRIME (fix broken things first)"
        run: python3 mycelium/PROBLEM_SOLVER_PRIME.py || echo "PROBLEM_SOLVER_PRIME error"
        continue-on-error: true

      - name: "🌍 Phase 0.0 pre-c — BIOREGIONAL_CLOCK (sync to Earth rhythm)"
        run: python3 mycelium/BIOREGIONAL_CLOCK.py || echo "BIOREGIONAL_CLOCK error"
        continue-on-error: true

      - name: "🌊 Phase 0c — PLANETARY_OVERFLOW (track digital→physical)"
        run: python3 mycelium/PLANETARY_OVERFLOW.py || echo "PLANETARY_OVERFLOW error"
        continue-on-error: true

      - name: "💰 Phase 0.0 pre-d — POOL_MANAGER (route all revenue, pay workers)"
        run: python3 mycelium/POOL_MANAGER.py || echo "POOL_MANAGER error"
        continue-on-error: true

      # ── PHASE 0: KNOWLEDGE + LOOP OPEN ─────────────────────────────────────

      - name: "📚 Phase 0.0a — REPO_LIBRARIAN (index full repo state)"
        run: python3 mycelium/REPO_LIBRARIAN.py || echo "REPO_LIBRARIAN error"
        continue-on-error: true

      - name: "🛍️ Phase 0.0b — PRODUCT_REGISTRY (map docs/ → Gumroad)"
        run: python3 mycelium/PRODUCT_REGISTRY.py || echo "PRODUCT_REGISTRY error"
        continue-on-error: true

      - name: "🔌 Phase 0.0c — CAPABILITY_BROKER (check live secret availability)"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OCTOEVERYWHERE_APP_API_KEY: ${{ secrets.OCTOEVERYWHERE_APP_API_KEY }}
          OCTOEVERYWHERE_APP_TOKEN: ${{ secrets.OCTOEVERYWHERE_APP_TOKEN }}
          RENTAHUMAN_API_KEY: ${{ secrets.RENTAHUMAN_API_KEY }}
          SOLARPUNK_WALLET_ADDRESS: ${{ secrets.SOLARPUNK_WALLET_ADDRESS }}
        run: python3 mycelium/CAPABILITY_BROKER.py || echo "CAPABILITY_BROKER error"
        continue-on-error: true

      - name: "🧠 Phase 0.0d — KNOWLEDGE_SYNTHESIZER (unify all knowledge sources)"
        run: python3 mycelium/KNOWLEDGE_SYNTHESIZER.py || echo "KNOWLEDGE_SYNTHESIZER error"
        continue-on-error: true

      - name: "🌐 Phase 0.0d2 — SWARM_QUERY (ask the swarm: where's the easy money?)"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          MASTODON_API_BASE_URL: ${{ secrets.MASTODON_API_BASE_URL }}
        run: python3 mycelium/SWARM_QUERY.py || echo "SWARM_QUERY error"
        continue-on-error: true

      - name: "🔗 Phase 0.0e — ORPHAN_CONNECTOR (wire unconnected data + scripts)"
        run: python3 mycelium/ORPHAN_CONNECTOR.py || echo "ORPHAN_CONNECTOR error"
        continue-on-error: true

      - name: "📦 Phase 0.0f — ARCHIVE_BRAIN (saves/ + knowledge_ingest/ → active loop)"
        run: python3 mycelium/ARCHIVE_BRAIN.py || echo "ARCHIVE_BRAIN error"
        continue-on-error: true

      - name: "🌅 Phase 0.0 — CYCLE_OPENER (read all knowledge → write cycle_brief)"
        run: python3 mycelium/CYCLE_OPENER.py || echo "CYCLE_OPENER error"
        continue-on-error: true

      - name: "0.0g — FREQUENCY_TUNER (harmonic check)"
        run: python mycelium/FREQUENCY_TUNER.py
        continue-on-error: true

      # ── PHASE 0: INTEGRITY ──────────────────────────────────────────────────

      - name: "⚖️ Phase 0.1 — COMPLIANCE_MONITOR (legal shell health)"
        env:
          SAMGOV_API_KEY: ${{ secrets.SAMGOV_API_KEY }}
        run: python3 mycelium/compliance_monitor.py || echo "COMPLIANCE_MONITOR error"
        continue-on-error: true

      - name: "🛡️ Phase 0 — GUARDIAN"
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 mycelium/GUARDIAN.py || echo "GUARDIAN error"
        continue-on-error: true

      - name: "🤖 Phase 0.5 — GEMINI_BRIDGE (fallback brain)"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
        run: python3 mycelium/GEMINI_BRIDGE.py || echo "GEMINI_BRIDGE error"
        continue-on-error: true

      # ── PHASE 1-2: HARVEST + MEMORY ────────────────────────────────────────

      - name: "🌿 Phase 1 — CONTENT_HARVESTER (free APIs, zero cost)"
        run: python3 mycelium/CONTENT_HARVESTER.py || echo "CONTENT_HARVESTER error"
        continue-on-error: true

      - name: "🆓 Phase 1.5 — FREE_API_ENGINE (zero-auth public data)"

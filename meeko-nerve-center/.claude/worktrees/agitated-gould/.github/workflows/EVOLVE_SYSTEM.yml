name: EVOLVE_SYSTEM
on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch: # Allows manual trigger

jobs:
  evolve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Mycelium
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests 2>/dev/null || true

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Mycelium-Guardian"

      - name: Run System Cross-Pollination
        run: python3 mycelium/CROSS_POLLINATOR.py || echo "CROSS_POLLINATOR error"
        continue-on-error: true

      - name: Run Health Booster
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 mycelium/HEALTH_BOOSTER.py || echo "HEALTH_BOOSTER error"
        continue-on-error: true

      - name: Update Living Documentation
        run: python3 mycelium/README_GENERATOR.py || echo "README_GENERATOR error"
        continue-on-error: true

      - name: "🧹 ENGINE_SANITIZER — clean before commit"
        run: python3 mycelium/ENGINE_SANITIZER.py || echo "ENGINE_SANITIZER error"
        continue-on-error: true

      - name: Commit Evolution
        run: |
          git add mycelium/ data/ docs/ 2>/dev/null || git add -A
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git -c commit.gpgsign=false commit -m "System Evolution: $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main 2>/dev/null || true
          git push origin main 2>/dev/null || git push origin HEAD:main --force-with-lease

name: SUPPLEMENTAL_ENGINES
on:
  schedule:
    - cron: '0 10 * * *'   # 10:00 UTC daily
    - cron: '0 22 * * *'   # 22:00 UTC daily
  workflow_dispatch:

jobs:
  supplemental:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      UNUSUAL_WHALES_API_KEY: ${{ secrets.UNUSUAL_WHALES_API_KEY }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BITCOIN_ADDRESS: ${{ secrets.BITCOIN_ADDRESS }}
      ETHEREUM_ADDRESS: ${{ secrets.ETHEREUM_ADDRESS }}
      SOLARPUNK_WALLET_ADDRESS: ${{ secrets.SOLARPUNK_WALLET_ADDRESS }}
      MONERO_ADDRESS: ${{ secrets.MONERO_ADDRESS }}
      OPENCOLLECTIVE_API_KEY: ${{ secrets.OPENCOLLECTIVE_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: pip install requests 2>/dev/null || true
      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "SolarPunk-Supplemental"

      # ═══════════════════════════════════════════════════════
      # LOOP OPEN — read last cycle state
      # ═══════════════════════════════════════════════════════
      - name: "🌅 CYCLE_OPENER — read last cycle → write cycle_brief"
        run: python3 mycelium/CYCLE_OPENER.py || echo "CYCLE_OPENER error"
        continue-on-error: true

      - name: "🌍 BIOREGIONAL_CLOCK"
        run: python mycelium/BIOREGIONAL_CLOCK.py
        continue-on-error: true

      # ═══════════════════════════════════════════════════════
      # BLOCK A — AI INFRASTRUCTURE
      # ═══════════════════════════════════════════════════════
      - name: "🧠 A1: AI_CLIENT — unified AI brain (GROQ→Anthropic→OpenRouter→HF)"
        run: python3 mycelium/AI_CLIENT.py || echo "AI_CLIENT error"
        continue-on-error: true

      - name: "📡 A2: CAPABILITY_SCANNER — audit what engines can actually do"
        run: python3 mycelium/CAPABILITY_SCANNER.py || echo "CAPABILITY_SCANNER error"
        continue-on-error: true

      - name: "🔗 A3: CHAIN_ORCHESTRATOR — chain multi-engine pipelines"

name: "🔐 Secret Intake — Secure API Key Delivery"

# How to use:
# 1. Go to github.com/meekoenergy/meeko-nerve-center/actions/workflows/SECRET_INTAKE.yml
# 2. Click "Run workflow"
# 3. Fill in the secret name and value
# 4. The workflow registers it as a GitHub Actions secret
# 5. SolarPunk auto-uses it on the next cycle
#
# Nobody sees the value — it's encrypted before storage.
# This is the "APIs come to ME" mechanism.

on:
  workflow_dispatch:
    inputs:
      secret_name:
        description: "Secret name (e.g. GROQ_API_KEY, HUGGINGFACE_TOKEN)"
        required: true
        type: string
      secret_value:
        description: "Secret value (encrypted in transit, stored encrypted)"
        required: true
        type: string
      engine_hint:
        description: "Which engine uses this? (auto-detect if blank)"
        required: false
        default: "auto-detect"
        type: string
      notify:
        description: "Send Telegram notification when registered"
        required: false
        default: "true"
        type: string

concurrency:
  group: secret-intake
  cancel-in-progress: false

permissions:
  contents: write
  secrets: write

jobs:
  register-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Register secret via gh CLI
        run: |
          echo "Registering secret: ${{ inputs.secret_name }}"
          echo -n "${{ inputs.secret_value }}" | gh secret set "${{ inputs.secret_name }}" --repo "${{ github.repository }}"
          echo "✓ Secret registered: ${{ inputs.secret_name }}"

      - name: Update capability manifest
        run: |
          python3 - <<'PYEOF'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          Path("data").mkdir(exist_ok=True)
          manifest_file = Path("data/registered_secrets_manifest.json")
          manifest = json.loads(manifest_file.read_text()) if manifest_file.exists() else {"secrets": []}

          secret_name = "${{ inputs.secret_name }}"
          entry = {
              "name": secret_name,
              "registered_at": datetime.now(timezone.utc).isoformat(),
              "registered_by": "SECRET_INTAKE workflow",
              "value": "REDACTED",
          }

          # Update or add
          existing = [s for s in manifest.get("secrets", []) if s["name"] != secret_name]
          manifest["secrets"] = existing + [entry]
          manifest["last_updated"] = entry["registered_at"]
          manifest["total_secrets"] = len(manifest["secrets"])

          manifest_file.write_text(json.dumps(manifest, indent=2))
          print(f"Manifest updated: {len(manifest['secrets'])} secrets registered")
          PYEOF

      - name: Notify via Telegram
        if: inputs.notify == 'true' && env.TELEGRAM_BOT_TOKEN != ''
        run: |
          python3 - <<'PYEOF'
          import json, os
          import urllib.request

          bot_token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")
          secret_name = "${{ inputs.secret_name }}"

          if bot_token and chat_id:
              msg = (
                  f"🔐 *New Secret Registered*\n\n"
                  f"Key: `{secret_name}`\n"
                  f"Status: ✅ Active\n"
                  f"SolarPunk will use it on the next cycle.\n\n"
                  f"_Registered securely via GitHub Actions_"
              )
              body = json.dumps({
                  "chat_id": chat_id,
                  "text": msg,
                  "parse_mode": "Markdown",
              }).encode()
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{bot_token}/sendMessage",
                  data=body,
                  headers={"Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      print(f"Telegram notified: {resp.status}")
              except Exception as e:
                  print(f"Telegram notify failed: {e}")
          PYEOF

      - name: Commit manifest update
        run: |
          git config user.name "SolarPunk-AI"
          git config user.email "ai@solarpunk.bot"
          git add data/registered_secrets_manifest.json
          git diff --cached --quiet || git -c commit.gpgsign=false commit -m "🔐 register new secret: ${{ inputs.secret_name }}"
          git push origin HEAD:main 2>/dev/null || git push origin HEAD --force-with-lease 2>/dev/null || echo "Push skipped"

      - name: Run capability broker to update active capabilities
        run: |
          pip install requests 2>/dev/null || true
          python mycelium/CAPABILITY_BROKER.py 2>/dev/null || echo "Capability broker will run on next OMNIBRAIN cycle"

      - name: Summary
        run: |
          echo "## 🔐 Secret Registered Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Secret Name:** \`${{ inputs.secret_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Engine:** ${{ inputs.engine_hint }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ Active in GitHub Actions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "SolarPunk will auto-detect and use this secret on the next cycle." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### APIs That Come To SolarPunk (All Free)" >> $GITHUB_STEP_SUMMARY
          echo "| Secret | Unlocks | Cost |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|---------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| GROQ_API_KEY | Fast free LLM (6000 tok/min) | FREE |" >> $GITHUB_STEP_SUMMARY
          echo "| UNUSUAL_WHALES_API_KEY | Live market data + options flow | FREE* |" >> $GITHUB_STEP_SUMMARY
          echo "| TELEGRAM_BOT_TOKEN | Real-time notifications to you | FREE |" >> $GITHUB_STEP_SUMMARY
          echo "| OCTOEVERYWHERE_APP_API_KEY | 3D printing relay for Gaza parts | FREE* |" >> $GITHUB_STEP_SUMMARY
          echo "| CLOUDFLARE_API_TOKEN | 10GB free storage + 100k req/day | FREE |" >> $GITHUB_STEP_SUMMARY
          echo "| PINATA_API_KEY | IPFS permanent storage (1GB free) | FREE |" >> $GITHUB_STEP_SUMMARY
          echo "| OPENCOLLECTIVE_API_KEY | Transparent community funding | FREE |" >> $GITHUB_STEP_SUMMARY
          echo "| INTAKE_PAT | PAT so more secrets can self-register | FREE |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**How other agents deliver keys:** Any A2A agent can POST to this workflow via GitHub API. Keys arrive automatically. Zero human interaction needed." >> $GITHUB_STEP_SUMMARY

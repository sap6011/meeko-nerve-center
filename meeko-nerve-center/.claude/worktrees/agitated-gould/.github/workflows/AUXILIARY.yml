name: AUXILIARY_ENGINES
on:
  schedule:
    - cron: '0 4 * * *'    # 04:00 UTC daily
    - cron: '0 16 * * *'   # 16:00 UTC daily
  workflow_dispatch:

jobs:
  auxiliary:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      UNUSUAL_WHALES_API_KEY: ${{ secrets.UNUSUAL_WHALES_API_KEY }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
      PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: pip install requests 2>/dev/null || true
      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "SolarPunk-Auxiliary"

      # ═══════════════════════════════════════════════════════
      # LOOP OPEN — read last cycle state
      # ═══════════════════════════════════════════════════════
      - name: "🌅 CYCLE_OPENER — read last cycle → write cycle_brief"
        run: python3 mycelium/CYCLE_OPENER.py || echo "CYCLE_OPENER error"
        continue-on-error: true

      # ═══════════════════════════════════════════════════════
      # BLOCK F — STRATEGY & ARCHITECTURE
      # ═══════════════════════════════════════════════════════
      - name: "🏗️ F1: ARCHITECT — strategic brain, long-range planning"
        run: python3 mycelium/ARCHITECT.py || echo "ARCHITECT error"
        continue-on-error: true

      - name: "🏗️ F2: AUTO_ARCHITECT — auto-generate architecture blueprints"
        run: python3 mycelium/AUTO_ARCHITECT.py || echo "AUTO_ARCHITECT error"
        continue-on-error: true

      - name: "📜 F3: AUTO_DOCS — auto-document project progress"
        run: python3 mycelium/AUTO_DOCS.py || echo "AUTO_DOCS error"
        continue-on-error: true

      - name: "🎯 F4: MISSION_CONTROL — mission orchestration hub"
        run: python3 mycelium/MISSION_CONTROL.py || echo "MISSION_CONTROL error"
        continue-on-error: true

      - name: "✅ F5: AUTONOMY_PROOF — live proof SolarPunk is running"
        run: python3 mycelium/AUTONOMY_PROOF.py || echo "AUTONOMY_PROOF error"
        continue-on-error: true


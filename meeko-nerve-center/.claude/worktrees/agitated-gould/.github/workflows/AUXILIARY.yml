      - name: Commit Auxiliary Outputs
        run: |
          git add mycelium/ data/ docs/ logs/ 2>/dev/null || git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git -c commit.gpgsign=false commit -m "AUXILIARY: engines cycle $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main 2>/dev/null || true
          git push origin main 2>/dev/null || git push origin HEAD:main --force-with-lease
